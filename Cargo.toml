[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
title-select-api = { path = "crates/api" }
title-select-engine = { path = "crates/engine" }
title-select-store = { path = "crates/store" }
title-select-server = { path = "crates/server" }
title-select-selection = { path = "crates/selection" }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
# The built-in Selection engine: Python-compatible regular expressions (lookaround) and ordered sets.
fancy-regex = "0.20.0"
# TorrentZip output (ADR 0007): deflate through zlib, built from the pinned libz-sys source and linked statically.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
libz-sys = { version = "=1.1.31", default-features = false, features = ["libc", "static"] }
# Library Folder writes: directory-relative `*at` calls with no-follow opens and no-replace renames.
# 7z in Ingest Folders (ADR 0018): read only, LZMA, LZMA2 and zstd. Its writer (`compress`) is for test fixtures alone.
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["zstd"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", features = ["serde"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
# Kept names compared as a case-insensitive, normalizing file system (APFS) compares them.
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

# `cargo leptos build --release` builds the workbench (crates/ui) to WebAssembly into target/site, which
# `title-select serve --ui target/site` serves, and the Service binary beside it.
[[workspace.metadata.leptos]]
name = "title-select"
bin-package = "title-select"
lib-package = "title-select-ui"
output-name = "title-select"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/ui/style/main.css"
assets-dir = "crates/ui/assets"
browserquery = "defaults and fully supports wasm"
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
