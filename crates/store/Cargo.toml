[package]
name = "title-select-store"
description = "Title Select's SQLite store: DAT Revisions, Source Sets, Audits, Jobs, Selection Profiles and Selections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
title-select-api.workspace = true
title-select-engine.workspace = true
jiff.workspace = true
rustix.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
ipnet = { version = "2.12.2", features = ["serde"] }
# Fetching from DAT Providers (ADR 0012): blocking HTTP over rustls, so the static image needs no OpenSSL.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
zip.workspace = true

[dev-dependencies]
sevenz-rust2 = { workspace = true, features = ["compress"] }
lzma-rust2.workspace = true
zstd.workspace = true
crc32fast.workspace = true
md-5.workspace = true
sha1.workspace = true
tempfile.workspace = true
walkdir.workspace = true
