name: conformance

# The built-in Selection engine against the bundled Retool over every fixture DAT and test profile. Pull-request CI
# runs a subset (every feature DAT, a few system DATs); this runs them all, which takes too long for every push.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: every fixture DAT and profile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: tools/retool/setup
      - run: cargo test --locked --package title-select-selection --test builtin
        env:
          CONFORMANCE_FULL: '1'
