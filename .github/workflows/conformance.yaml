name: conformance

# The built-in Selection engine against the bundled Retool over every fixture DAT and test profile. Pull-request CI
# runs a subset (every feature DAT, a few system DATs); this runs them all, which takes too long for every pull
# request. It runs when main changes either engine, what it reads or this workflow, and on demand. It goes with the
# bundled engine at the cutover (#95).

on:
  push:
    branches: [main]
    paths:
      - 'crates/selection/**'
      - 'crates/api/**'
      - 'third_party/retool/**'
      - 'tools/retool/**'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
      - '.github/workflows/conformance.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: every fixture DAT and profile
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: tools/retool/setup
      # Release: a debug build of the built-in engine misses the 300 s limit on the largest DATs.
      - run: cargo test --release --locked --package title-select-selection --test builtin
        env:
          CONFORMANCE_FULL: '1'
