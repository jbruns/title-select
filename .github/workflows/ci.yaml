name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    # Keeps target/ within the runner's disk: a one-shot build gains nothing from incremental artifacts, and line
    # tables still give panics their file and line.
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup on the runner installs the toolchain rust-toolchain.toml pins.
      - run: rustup show active-toolchain
      # The pinned clone lists the Selection tests read.
      - run: tools/clone-lists/fetch
      # The image's own chdman, from its pinned MAME release, for the CHD tests; they fail in CI without it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: chdman
          outputs: type=local,dest=${{ runner.temp }}/chdman
          cache-from: |
            type=gha,scope=chdman
            type=gha
          cache-to: type=gha,mode=max,scope=chdman
      - run: echo "TITLE_SELECT_CHDMAN=$RUNNER_TEMP/chdman/chdman" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The workbench as the browser runs it; the image build compiles it the same way.
      - run: cargo clippy --package title-select-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy --package title-select-ui --target wasm32-unknown-unknown --features bench --locked -- -D warnings
      - run: cargo test --locked
      # Every fixture golden: a debug build checks only some of them, a release build all of them in about a minute.
      - run: cargo test --release --locked --package title-select-selection --test fixtures

  image:
    name: image build, smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: title-select:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The Service must start with a read-only root filesystem, writing only to its store volume.
      - name: smoke test
        run: |
          token="$(openssl rand -hex 32)"
          printf '%s\n' "$token" > "$RUNNER_TEMP/token"
          chmod 644 "$RUNNER_TEMP/token"
          printf 'Authorization: Bearer %s' "$token" > "$RUNNER_TEMP/auth-header"
          docker run --detach --name service --read-only -p 8080:8080 \
            -v title-select-store:/store -v "$RUNNER_TEMP/token:/run/operator-token:ro" \
            -e TITLE_SELECT_OPERATOR_TOKEN_FILE=/run/operator-token title-select:ci
          for _ in $(seq 30); do curl -fsS localhost:8080/api/v1/health && break; sleep 1; done
          curl -fsS -H @"$RUNNER_TEMP/auth-header" localhost:8080/api/v1/jobs
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/jobs)" = 401
          # The workbench's bundle is served beside the API.
          curl -fsS localhost:8080/ | grep -q '/boot.js'
          curl -fsS -o /dev/null -H 'Accept-Encoding: br' localhost:8080/pkg/title-select.wasm
          curl -fsS localhost:8080/source-sets | grep -q '/boot.js'
          # The About page's licence texts are served as plain text.
          for licence in title-select retool retool-clonelists-metadata mame; do
            curl -fsS -D - -o "$RUNNER_TEMP/$licence.txt" "localhost:8080/licences/$licence.txt" \
              | grep -qi '^content-type: text/plain'
            grep -q 'Copyright' "$RUNNER_TEMP/$licence.txt"
          done
      # A Selection runs offline on the image's clone lists, writing nothing.
      - name: select smoke test
        run: |
          printf '{"region_order": ["USA"]}\n' > "$RUNNER_TEMP/profile.json"
          chmod 644 "$RUNNER_TEMP/profile.json"
          docker run --rm --read-only --network none -v title-select-select:/store \
            -v "$PWD/third_party/retool/fixtures/source/features:/dats:ro" \
            -v "$RUNNER_TEMP/profile.json:/run/profile.json:ro" \
            title-select:ci select --dat '/dats/Retool - Prefer regions.dat' --profile /run/profile.json \
            > "$RUNNER_TEMP/selection.json"
          commit="$(grep -m1 '^commit = ' third_party/clone-lists/pins.toml | cut -d'"' -f2)"
          jq -e --arg commit "$commit" '.summary.groups > 0 and .pins.clone_list_commit == $commit
            and (.pins.title_select_version | length > 0) and (.pins | has("retool_commit") | not)' \
            "$RUNNER_TEMP/selection.json"
          docker run --rm title-select:ci --version | grep -q "$commit"
      # CHD builds run the image's chdman, the pinned MAME release's, from the path the image names.
      - name: chdman smoke test
        run: |
          version="$(grep -m1 '^ARG MAME_VERSION=' Dockerfile | cut -d= -f2)"
          # chdman with no command prints its banner and exits nonzero.
          { docker run --rm --read-only --entrypoint /usr/local/bin/chdman title-select:ci || true; } \
            | grep -q "manager 0\.${version#mame0} "
          docker image inspect title-select:ci --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -qx 'TITLE_SELECT_CHDMAN=/usr/local/bin/chdman'
      - if: always()
        run: docker logs service

  publish:
    name: publish image
    if: github.event_name == 'push'
    needs: [rust, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jbruns/title-select
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  gitleaks:
    name: gitleaks
    uses: jbruns/homelab-components/.github/workflows/repo-gitleaks.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0

  tooling:
    name: renovate config, actionlint
    uses: jbruns/homelab-components/.github/workflows/repo-lint.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0
