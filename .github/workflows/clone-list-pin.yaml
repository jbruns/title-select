name: clone-list pin

# Renovate moves the clone-list commit in third_party/clone-lists/pins.toml, or the curated list's in
# third_party/curated-list/pins.toml, but can't know the new archive's sha256. This writes both on the Renovate
# branch, then runs CI on the result: a push made with the workflow's token starts no workflows by itself.
#
# The job holds a write token, so it runs no code from the branch: the default branch's fetch scripts hash the
# archives the branch's pins.toml files name, and only the push and the CI dispatch see the token.

on:
  push:
    branches: ['renovate/**']
    paths: [third_party/clone-lists/pins.toml, third_party/curated-list/pins.toml]

permissions:
  contents: read

concurrency:
  group: clone-list-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: clone-list and curated-list archive sha256
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: check out the default branch's tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: check out the Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: branch
          persist-credentials: false
      - name: hash the archives
        run: |
          for list in clone-lists curated-list; do
            cp "branch/third_party/$list/pins.toml" "trusted/third_party/$list/pins.toml"
            sh "trusted/tools/$list/fetch" pin
            cp "trusted/third_party/$list/pins.toml" "branch/third_party/$list/pins.toml"
          done
      - name: commit and run CI
        working-directory: branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "the archive sha256s are already pinned"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Pin the archive sha256'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$BRANCH"
          gh workflow run ci.yaml --ref "$BRANCH"
